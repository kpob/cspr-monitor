name: casper-monitor-dev

networks:
  dev:
    driver: bridge

x-app: &app
  build:
    context: .
  networks: [dev]
  restart: on-failure
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # One-shot container that makes the nctl-keys volume writable by the nctl user
  nctl-init:
    image: busybox
    user: "0"
    command: ["chmod", "777", "/nctl-keys"]
    volumes:
      - nctl-keys:/nctl-keys
    networks: [dev]

  nctl:
    image: makesoftware/casper-nctl:v203
    networks: [dev]
    cpus: 1
    depends_on:
      nctl-init:
        condition: service_completed_successfully
    ports:
      - "11101:11101"
      - "14101:14101"
      - "18101:18101"
      - "25101:25101"
    volumes:
      - nctl-keys:/nctl-keys
    healthcheck:
      # Keys must exist AND node must be in Validate state (actively producing blocks)
      test: ["CMD-SHELL", "test -f /nctl-keys/secret_key.pem && curl -sf http://localhost:14101/status | grep -q 'Validate'"]
      interval: 10s
      retries: 36
      start_period: 30s
    command:
      - /bin/bash
      - -c
      - |
        # Run the startup script but kill the tail -f at the end
        # by running it in a subshell and intercepting the tail
        bash /home/casper/restart.sh &
        NCTL_PID=$$!

        # Wait for keys to be generated by the setup scripts
        echo "Waiting for keys..."
        until [ -f /home/casper/casper-nctl/assets/net-1/users/user-1/secret_key.pem ]; do
          sleep 2
        done

        echo "Copying keys to shared volume..."
        cp /home/casper/casper-nctl/assets/net-1/users/user-1/secret_key.pem /nctl-keys/secret_key.pem
        cp /home/casper/casper-nctl/assets/net-1/users/user-2/secret_key.pem /nctl-keys/secret_key_1.pem
        cp /home/casper/casper-nctl/assets/net-1/users/user-3/secret_key.pem /nctl-keys/secret_key_2.pem
        cp /home/casper/casper-nctl/assets/net-1/users/user-4/secret_key.pem /nctl-keys/secret_key_3.pem
        echo "Keys ready."

        # Keep waiting on the nctl process
        wait $$NCTL_PID

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    networks: [dev]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # Required for KRaft: must map every listener name to a security protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 7T_zQf_kSKqWaHGYuK_4bw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    networks: [dev]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ingest_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 5s
      retries: 10
      start_period: 5s

  ingestion:
    <<: *app
    command: ingestion
    environment:
      LIVENET_EVENT_ADDRESS: http://nctl:18101/events
      DATABASE_URL: postgres://dev:dev@postgres:5432/ingest_dev
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  event-router:
    <<: *app
    command: event-router
    environment:
      DATABASE_URL: postgres://dev:dev@postgres:5432/ingest_dev
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  contract-deployer:
    <<: *app
    command: contract-deployer
    restart: "no"
    volumes:
      - ./wasm:/app/wasm:ro
      - nctl-keys:/keys:ro
      - casper-data:/casper-data
    environment:
      RUST_LOG: debug
      RUST_BACKTRACE: "1"
      ODRA_LOG_LEVEL: debug
      ODRA_CASPER_LIVENET_NODE_ADDRESS: http://nctl:11101
      ODRA_CASPER_LIVENET_CHAIN_NAME: casper-net-1
      ODRA_CASPER_LIVENET_EVENTS_URL: http://nctl:18101/events
      ODRA_CASPER_LIVENET_SECRET_KEY_PATH: /keys/secret_key.pem
      DATABASE_URL: postgres://dev:dev@postgres:5432/ingest_dev
      DEPLOYED_ADDRESSES_PATH: /casper-data/deployed_addresses.txt
    depends_on:
      nctl:
        condition: service_healthy
      postgres:
        condition: service_healthy

  simulator:
    <<: *app
    command: simulator
    volumes:
      - nctl-keys:/keys:ro
      - casper-data:/casper-data
    environment:
      ODRA_CASPER_LIVENET_NODE_ADDRESS: http://nctl:11101
      ODRA_CASPER_LIVENET_CHAIN_NAME: casper-net-1
      ODRA_CASPER_LIVENET_EVENTS_URL: http://nctl:18101/events
      ODRA_CASPER_LIVENET_SECRET_KEY_PATH: /keys/secret_key.pem
      ODRA_CASPER_LIVENET_KEY_1: /keys/secret_key_1.pem
      ODRA_CASPER_LIVENET_KEY_2: /keys/secret_key_2.pem
      ODRA_CASPER_LIVENET_KEY_3: /keys/secret_key_3.pem
      DEPLOYED_ADDRESSES_PATH: /casper-data/deployed_addresses.txt
    depends_on:
      contract-deployer:
        condition: service_completed_successfully

volumes:
  kafka-data:
  postgres-data:
  nctl-keys:
  casper-data:
