global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: casper-ingestion
    static_configs:
      - targets: ['ingestion:9100']

  - job_name: casper-event-router
    static_configs:
      - targets: ['event-router:9101']

  - job_name: casper-exchange-monitor
    static_configs:
      - targets: ['exchange-monitor:9102']
