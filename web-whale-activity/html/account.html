<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Whale Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <link rel="stylesheet" href="/static/css/account.css">
</head>
<body>
  <div class="app">

    <header class="hdr">
      <a class="back" href="/">&larr; Dashboard</a>
      <h1>Account: <span class="addr" id="addrDisplay">...</span></h1>
      <div class="conn">
        <span class="conn-dot" id="connDot"></span>
        <span id="connText">Connecting&hellip;</span>
      </div>
    </header>

    <div class="summary" id="summary" style="display:none">
      <div class="stat-card">
        <div class="stat-label">Transactions</div>
        <div class="stat-value" id="statTxCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Volume</div>
        <div class="stat-value"><span id="statVolume">0</span><span class="unit">CSPR</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Counterparties</div>
        <div class="stat-value" id="statCounterparties">0</div>
      </div>
    </div>

    <div class="graph-panel">
      <h2>Interaction Graph</h2>
      <div id="graphContainer">
        <span class="graph-empty" id="graphEmpty">Waiting for counterparty data&hellip;</span>
        <div class="graph-tooltip" id="graphTooltip"></div>
      </div>
    </div>

    <div class="tx-panel">
      <h2>Transactions</h2>
      <div class="stream" id="stream">
        <p class="empty-msg" id="emptyMsg">Loading transactions&hellip;</p>
      </div>
    </div>

  </div>

  <script>
  const M = 1_000_000_000;
  const address = window.location.pathname.split('/account/')[1] || '';

  const ACTIONS = {
    native_transfer: { label: 'Transfer',    color: '#22d3ee', cls: 'transfer' },
    transfer_in:     { label: 'Transfer In',  color: '#22d3ee', cls: 'transfer' },
    transfer_out:    { label: 'Transfer Out', color: '#22d3ee', cls: 'transfer' },
    delegation:      { label: 'Delegate',     color: '#a78bfa', cls: 'delegation' },
    undelegation:    { label: 'Undelegate',   color: '#fb7185', cls: 'undelegation' },
    redelegation:    { label: 'Redelegate',   color: '#fbbf24', cls: 'redelegation' },
    add_bid:         { label: 'Add Bid',      color: '#34d399', cls: 'bid' },
    withdraw_bid:    { label: 'Withdraw Bid', color: '#34d399', cls: 'bid' },
    activate_bid:    { label: 'Activate Bid', color: '#34d399', cls: 'bid' },
    session:         { label: 'Session',      color: '#64748b', cls: 'other' },
  };

  function actionMeta(a) {
    if (a.startsWith('contract:')) return { label: a.replace('contract:', ''), color: '#64748b', cls: 'other' };
    return ACTIONS[a] || { label: a, color: '#64748b', cls: 'other' };
  }

  function cspr(motes) { return (motes / M).toLocaleString(undefined, { maximumFractionDigits: 0 }); }

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    catch (_) { return iso; }
  }

  function shortAddr(a) {
    return a.length > 16 ? a.slice(0, 8) + '..' + a.slice(-6) : a;
  }

  // -- State --
  let txCount = 0;
  let totalVolume = 0;
  const targets = {}; // addr -> { tx_count, total_amount, actions }

  function updateSummary() {
    document.getElementById('summary').style.display = '';
    document.getElementById('statTxCount').textContent = txCount;
    document.getElementById('statVolume').textContent = cspr(totalVolume);
    document.getElementById('statCounterparties').textContent = Object.keys(targets).length;
  }

  // -- Transaction stream --
  const MAX_STREAM = 50;

  function addStreamEvent(record, animate) {
    const el = document.getElementById('stream');
    const empty = document.getElementById('emptyMsg');
    if (empty) empty.remove();

    const m = actionMeta(record.action);
    const isSender = record.actor_address === address;
    const fromAddr = record.actor_address;
    const toAddr = record.target;

    const div = document.createElement('div');
    div.className = 'evt' + (animate ? ' new' : '');
    div.innerHTML = `
      <span class="evt-time">${fmtTime(record.timestamp)}</span>
      <span class="evt-action ${m.cls}">${m.label}</span>
      <span class="evt-detail">
        <a class="evt-addr${fromAddr === address ? ' self-addr' : ''}" href="/account/${fromAddr}">${fromAddr === address ? 'this account' : shortAddr(fromAddr)}</a>
        <span class="evt-arrow">&rarr;</span>
        <a class="evt-addr${toAddr === address ? ' self-addr' : ''}" href="/account/${toAddr}">${toAddr === address ? 'this account' : (toAddr === 'self' ? 'self' : shortAddr(toAddr))}</a>
      </span>
      <span class="evt-amount">${cspr(record.amount)}</span>
      <a class="evt-tx" href="https://cspr.live/transaction/${record.tx_hash}" target="_blank" rel="noopener">${record.tx_hash.slice(0, 10)}&hellip;</a>`;
    el.prepend(div);
    while (el.children.length > MAX_STREAM) el.removeChild(el.lastChild);
  }

  function applyRecord(record) {
    txCount += 1;
    totalVolume += record.amount;
    const other = record.actor_address === address ? record.target : record.actor_address;
    if (!targets[other]) targets[other] = { tx_count: 0, total_amount: 0, actions: {} };
    targets[other].tx_count += 1;
    targets[other].total_amount += record.amount;
    targets[other].actions[record.action] = (targets[other].actions[record.action] || 0) + record.amount;
  }

  // -- Bootstrap --
  async function bootstrap() {
    try {
      const res = await fetch('/api/account/' + address);
      if (!res.ok) return;
      const data = await res.json();

      // Load targets summary
      for (const [addr, summary] of Object.entries(data.targets || {})) {
        targets[addr] = { ...summary };
      }

      // Load events
      const events = (data.events || []).slice(0, MAX_STREAM);
      txCount = events.length;
      totalVolume = events.reduce((sum, r) => sum + r.amount, 0);

      events.reverse().forEach(r => addStreamEvent(r, false));
      updateSummary();

      if (events.length === 0) {
        document.getElementById('stream').innerHTML = '<p class="empty-msg">No transactions found for this account.</p>';
      }
    } catch (e) {
      console.warn('Bootstrap failed:', e);
    }
  }

  // -- SSE --
  let sse = null;
  let reconnectDelay = 1000;
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource('/events');
    sse.onopen = () => {
      dot.classList.remove('off');
      txt.textContent = 'Live';
      reconnectDelay = 1000;
    };
    sse.onmessage = (e) => {
      let record;
      try { record = JSON.parse(e.data); } catch (_) { return; }
      if (record.actor_address !== address && record.target !== address) return;
      applyRecord(record);
      addStreamEvent(record, true);
      updateSummary();
      buildGraph();
    };
    sse.onerror = () => {
      dot.classList.add('off');
      txt.textContent = 'Reconnecting\u2026';
      sse.close();
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connectSSE();
      }, reconnectDelay);
    };
  }

  // -- D3 Graph --
  let simulation = null;
  let svg = null;
  let graphGroup = null;
  const tooltip = document.getElementById('graphTooltip');

  function dominantAction(actions) {
    let max = 0, best = 'unknown';
    for (const [a, v] of Object.entries(actions)) {
      if (v > max) { max = v; best = a; }
    }
    return best;
  }

  function buildGraph() {
    const container = document.getElementById('graphContainer');
    const empty = document.getElementById('graphEmpty');
    const entries = Object.entries(targets);
    if (entries.length === 0) return;
    if (empty) empty.style.display = 'none';

    const width = container.clientWidth;
    const height = container.clientHeight;
    const cx = width / 2;
    const cy = height / 2;

    // Build nodes and links
    const nodes = [{ id: address, label: shortAddr(address), isCenter: true, radius: 22 }];
    const links = [];

    entries.forEach(([addr, info]) => {
      const vol = info.total_amount / M;
      const r = Math.max(8, Math.min(18, 4 + Math.sqrt(vol / 1000) * 2));
      nodes.push({ id: addr, label: addr === 'self' ? 'self' : shortAddr(addr), isCenter: false, radius: r, info });
      links.push({
        source: address,
        target: addr,
        value: info.tx_count,
        amount: info.total_amount,
        action: dominantAction(info.actions),
      });
    });

    // Clear previous
    container.querySelectorAll('svg').forEach(el => el.remove());

    svg = d3.select(container).append('svg')
      .attr('width', width)
      .attr('height', height);

    // Arrow marker definitions
    const defs = svg.append('defs');
    const markerColors = new Set(links.map(l => actionMeta(l.action).color));
    markerColors.forEach(color => {
      defs.append('marker')
        .attr('id', 'arrow-' + color.replace('#', ''))
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 20)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', color);
    });

    graphGroup = svg.append('g');

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.3, 3])
      .on('zoom', (event) => graphGroup.attr('transform', event.transform));
    svg.call(zoom);

    // Links
    const link = graphGroup.selectAll('.link')
      .data(links)
      .join('line')
      .attr('class', 'link')
      .attr('stroke', d => actionMeta(d.action).color)
      .attr('stroke-opacity', 0.5)
      .attr('stroke-width', d => Math.max(1.5, Math.min(6, d.value * 1.5)))
      .attr('marker-end', d => `url(#arrow-${actionMeta(d.action).color.replace('#', '')})`);

    // Link labels (CSPR amount)
    const linkLabel = graphGroup.selectAll('.link-label')
      .data(links)
      .join('text')
      .attr('class', 'link-label')
      .text(d => cspr(d.amount) + ' CSPR');

    // Nodes
    const node = graphGroup.selectAll('.node')
      .data(nodes, d => d.id)
      .join('circle')
      .attr('class', 'node')
      .attr('r', d => d.radius)
      .attr('fill', d => d.isCenter ? '#22d3ee' : actionMeta(dominantAction(d.info?.actions || {})).color + '88')
      .attr('stroke', d => d.isCenter ? '#22d3ee' : actionMeta(dominantAction(d.info?.actions || {})).color)
      .attr('stroke-width', d => d.isCenter ? 2.5 : 1.5)
      .attr('cursor', d => d.isCenter ? 'default' : 'pointer')
      .on('click', (event, d) => {
        if (!d.isCenter && d.id !== 'self') {
          window.location.href = '/account/' + d.id;
        }
      })
      .on('mouseover', (event, d) => {
        if (d.isCenter) {
          tooltip.innerHTML = `<strong>This account</strong><br>${address}`;
        } else {
          const info = d.info;
          const acts = Object.entries(info.actions).map(([a, v]) => `${actionMeta(a).label}: ${cspr(v)} CSPR`).join('<br>');
          tooltip.innerHTML = `<strong>${d.id}</strong><br>${info.tx_count} tx &middot; ${cspr(info.total_amount)} CSPR<br>${acts}`;
        }
        tooltip.style.display = 'block';
        tooltip.style.left = (event.offsetX + 12) + 'px';
        tooltip.style.top = (event.offsetY - 10) + 'px';
      })
      .on('mousemove', (event) => {
        tooltip.style.left = (event.offsetX + 12) + 'px';
        tooltip.style.top = (event.offsetY - 10) + 'px';
      })
      .on('mouseout', () => { tooltip.style.display = 'none'; })
      .call(d3.drag()
        .on('start', (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on('end', (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          if (!d.isCenter) { d.fx = null; d.fy = null; }
        })
      );

    // Labels
    const label = graphGroup.selectAll('.node-label')
      .data(nodes, d => d.id)
      .join('text')
      .attr('class', d => 'node-label' + (d.isCenter ? ' center' : ''))
      .text(d => d.label)
      .attr('dy', d => d.radius + 13);

    // Force simulation
    simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(140))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(cx, cy))
      .force('collide', d3.forceCollide().radius(d => d.radius + 20))
      .on('tick', () => {
        // Pin center node
        const center = nodes[0];
        center.fx = cx;
        center.fy = cy;

        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        linkLabel
          .attr('x', d => (d.source.x + d.target.x) / 2)
          .attr('y', d => (d.source.y + d.target.y) / 2 - 6);

        node.attr('cx', d => d.x).attr('cy', d => d.y);
        label.attr('x', d => d.x).attr('y', d => d.y);
      });
  }

  // -- Init --
  document.getElementById('addrDisplay').textContent = shortAddr(address);
  document.title = `Account ${shortAddr(address)} — Whale Activity`;
  bootstrap().then(() => { buildGraph(); connectSSE(); });
  </script>
</body>
</html>
