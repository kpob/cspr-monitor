<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casper Exchange Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: #a78bfa; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #1e2131;
      border: 1px solid #2d3148;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .card h2 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #2d3148;
      font-size: 0.875rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .exchange-name { font-weight: 600; color: #c4b5fd; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-in  { background: #14532d; color: #86efac; }
    .badge-out { background: #7f1d1d; color: #fca5a5; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .status-bar {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th {
      text-align: left;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      padding: 0 0 0.5rem 0;
      border-bottom: 1px solid #2d3148;
    }
    td {
      padding: 0.5rem 0;
      border-bottom: 1px solid #1a1f30;
      vertical-align: middle;
    }
    td.mono { font-family: monospace; font-size: 0.75rem; color: #94a3b8; }
    .chart-wrap { position: relative; height: 220px; }
    #emptyMsg { text-align: center; color: #475569; margin-top: 2rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Casper Exchange Monitor</h1>
  <p class="subtitle">Live inflow / outflow tracking for monitored exchanges</p>

  <div class="status-bar">
    <span class="status-dot" id="sseStatusDot"></span>
    <span id="sseStatusText">Connecting to live stream...</span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Inflow vs Outflow (CSPR)</h2>
      <div class="chart-wrap">
        <canvas id="flowChart"></canvas>
      </div>
    </div>
    <div class="card">
      <h2>Exchange Stats</h2>
      <div id="statsContainer"><p id="emptyMsg">No data yet — waiting for events.</p></div>
    </div>
  </div>

  <div class="card">
    <h2>Live Event Log</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Exchange</th>
          <th>Direction</th>
          <th>Amount (CSPR)</th>
          <th>Counterparty</th>
          <th>Status</th>
          <th>Tx Hash</th>
        </tr>
      </thead>
      <tbody id="eventTable"></tbody>
    </table>
  </div>

  <script>
  const MOTES_PER_CSPR = 1_000_000_000;

  const ctx = document.getElementById('flowChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Inflow (CSPR)',
          data: [],
          backgroundColor: 'rgba(134, 239, 172, 0.7)',
          borderColor: '#86efac',
          borderWidth: 1,
        },
        {
          label: 'Outflow (CSPR)',
          data: [],
          backgroundColor: 'rgba(252, 165, 165, 0.7)',
          borderColor: '#fca5a5',
          borderWidth: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#2d3148' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#2d3148' }, beginAtZero: true },
      },
      plugins: { legend: { labels: { color: '#e2e8f0', font: { size: 11 } } } },
    },
  });

  const exchangeStats = {};
  const MAX_TABLE_ROWS = 20;

  function toCSPR(motes) {
    return (motes / MOTES_PER_CSPR).toFixed(4);
  }

  function formatTime(iso) {
    try { return new Date(iso).toLocaleTimeString(); } catch (_) { return iso; }
  }

  function refreshChart() {
    const labels = Object.keys(exchangeStats);
    chart.data.labels = labels;
    chart.data.datasets[0].data = labels.map(e => toCSPR(exchangeStats[e].inflow_total));
    chart.data.datasets[1].data = labels.map(e => toCSPR(exchangeStats[e].outflow_total));
    chart.update();
  }

  function refreshStats() {
    const container = document.getElementById('statsContainer');
    const entries = Object.entries(exchangeStats);
    if (entries.length === 0) {
      container.innerHTML = '<p id="emptyMsg">No data yet — waiting for events.</p>';
      return;
    }
    container.innerHTML = entries.map(([name, s]) => `
      <div class="stat-row">
        <span class="exchange-name">${name}</span>
        <span>
          <span style="color:#86efac">+${toCSPR(s.inflow_total)}</span>
          &nbsp;/&nbsp;
          <span style="color:#fca5a5">-${toCSPR(s.outflow_total)}</span>
          &nbsp; CSPR &nbsp;
          <span style="color:#94a3b8">(${s.tx_count} tx)</span>
        </span>
      </div>`).join('');
  }

  function prependTableRow(record) {
    const tbody = document.getElementById('eventTable');
    const badge = record.direction === 'inflow'
      ? '<span class="badge badge-in">INFLOW</span>'
      : '<span class="badge badge-out">OUTFLOW</span>';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${formatTime(record.timestamp)}</td>
      <td style="color:#c4b5fd;font-weight:600">${record.exchange}</td>
      <td>${badge}</td>
      <td>${toCSPR(record.amount)}</td>
      <td class="mono">${record.counterparty.slice(0, 20)}…</td>
      <td style="color:${record.status==='Success'?'#86efac':'#fca5a5'}">${record.status}</td>
      <td class="mono">${record.tx_hash.slice(0, 12)}…</td>`;
    tbody.prepend(row);
    while (tbody.rows.length > MAX_TABLE_ROWS) tbody.deleteRow(tbody.rows.length - 1);
  }

  function applyRecord(record) {
    if (!exchangeStats[record.exchange]) {
      exchangeStats[record.exchange] = { inflow_total: 0, outflow_total: 0, tx_count: 0 };
    }
    const s = exchangeStats[record.exchange];
    s.tx_count += 1;
    if (record.direction === 'inflow') {
      s.inflow_total += record.amount;
    } else {
      s.outflow_total += record.amount;
    }
  }

  async function bootstrap() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) return;
      const data = await res.json();
      for (const [name, stats] of Object.entries(data.exchanges || {})) {
        exchangeStats[name] = { ...stats };
      }
      (data.recent_events || []).slice(0, MAX_TABLE_ROWS).reverse().forEach(prependTableRow);
      refreshChart();
      refreshStats();
    } catch (e) {
      console.warn('Bootstrap failed:', e);
    }
  }

  let sse = null;
  let reconnectDelay = 1000;

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource('/events');
    sse.onopen = () => {
      document.getElementById('sseStatusDot').style.background = '#22c55e';
      document.getElementById('sseStatusText').textContent = 'Connected — receiving live events';
      reconnectDelay = 1000;
    };
    sse.onmessage = (e) => {
      let record;
      try { record = JSON.parse(e.data); } catch (_) { return; }
      applyRecord(record);
      prependTableRow(record);
      refreshChart();
      refreshStats();
    };
    sse.onerror = () => {
      document.getElementById('sseStatusDot').style.background = '#ef4444';
      document.getElementById('sseStatusText').textContent =
        `Disconnected — reconnecting in ${reconnectDelay / 1000}s…`;
      sse.close();
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connectSSE();
      }, reconnectDelay);
    };
  }

  bootstrap().then(() => connectSSE());
  </script>
</body>
</html>
