<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casper Exchange Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/styles/dashboard.css">
</head>
<body>
  <h1>Casper Exchange Monitor</h1>
  <p class="subtitle">Live inflow / outflow tracking for monitored exchanges</p>

  <div class="status-bar">
    <span class="status-dot" id="sseStatusDot"></span>
    <span id="sseStatusText">Connecting to live stream...</span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Inflow vs Outflow (CSPR)</h2>
      <div class="chart-wrap">
        <canvas id="flowChart"></canvas>
      </div>
    </div>
    <div class="card">
      <h2>Exchange Stats</h2>
      <div id="statsContainer"><p id="emptyMsg">No data yet — waiting for events.</p></div>
    </div>
  </div>

  <div class="card">
    <h2>Live Event Log</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Exchange</th>
          <th>Direction</th>
          <th>Amount (CSPR)</th>
          <th>Counterparty</th>
          <th>Status</th>
          <th>Tx Hash</th>
        </tr>
      </thead>
      <tbody id="eventTable"></tbody>
    </table>
  </div>

  <script>
  const MOTES_PER_CSPR = 1_000_000_000;

  const ctx = document.getElementById('flowChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Inflow (CSPR)',
          data: [],
          backgroundColor: 'rgba(134, 239, 172, 0.7)',
          borderColor: '#86efac',
          borderWidth: 1,
        },
        {
          label: 'Outflow (CSPR)',
          data: [],
          backgroundColor: 'rgba(252, 165, 165, 0.7)',
          borderColor: '#fca5a5',
          borderWidth: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#2d3148' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#2d3148' }, beginAtZero: true },
      },
      plugins: { legend: { labels: { color: '#e2e8f0', font: { size: 11 } } } },
    },
  });

  const actorStats = {};
  const MAX_TABLE_ROWS = 20;

  function toCSPR(motes) {
    return (motes / MOTES_PER_CSPR).toFixed(2);
  }

  function formatTime(iso) {
    try { return new Date(iso).toLocaleTimeString(); } catch (_) { return iso; }
  }

  function refreshChart() {
    const labels = Object.keys(actorStats);
    const totalInflow = labels.reduce((sum, e) => sum + (actorStats[e].actions['inflow'] || 0), 0);
    const totalOutflow = labels.reduce((sum, e) => sum + (actorStats[e].actions['outflow'] || 0), 0);
    const allLabels = labels.length > 1 ? ['Total', ...labels] : labels;
    chart.data.labels = allLabels;
    chart.data.datasets[0].data = labels.length > 1
      ? [toCSPR(totalInflow), ...labels.map(e => toCSPR(actorStats[e].actions['inflow'] || 0))]
      : labels.map(e => toCSPR(actorStats[e].actions['inflow'] || 0));
    chart.data.datasets[1].data = labels.length > 1
      ? [toCSPR(totalOutflow), ...labels.map(e => toCSPR(actorStats[e].actions['outflow'] || 0))]
      : labels.map(e => toCSPR(actorStats[e].actions['outflow'] || 0));
    chart.update();
  }

  function refreshStats() {
    const container = document.getElementById('statsContainer');
    const entries = Object.entries(actorStats);
    if (entries.length === 0) {
      container.innerHTML = '<p id="emptyMsg">No data yet — waiting for events.</p>';
      return;
    }
    const totalInflow = entries.reduce((sum, [, s]) => sum + (s.actions['inflow'] || 0), 0);
    const totalOutflow = entries.reduce((sum, [, s]) => sum + (s.actions['outflow'] || 0), 0);
    const totalTxCount = entries.reduce((sum, [, s]) => sum + s.tx_count, 0);
    const totalRow = entries.length > 1 ? `
      <div class="stat-row" style="border-bottom:1px solid #4d3f6b;margin-bottom:0.25rem">
        <span class="exchange-name" style="color:#a78bfa">Total</span>
        <span>
          <span style="color:#86efac">+${toCSPR(totalInflow)}</span>
          &nbsp;/&nbsp;
          <span style="color:#fca5a5">-${toCSPR(totalOutflow)}</span>
          &nbsp; CSPR &nbsp;
          <span style="color:#94a3b8">(${totalTxCount} tx)</span>
        </span>
      </div>` : '';
    container.innerHTML = totalRow + entries.map(([name, s]) => `
      <div class="stat-row">
        <span class="exchange-name">${name}</span>
        <span>
          <span style="color:#86efac">+${toCSPR(s.actions['inflow'] || 0)}</span>
          &nbsp;/&nbsp;
          <span style="color:#fca5a5">-${toCSPR(s.actions['outflow'] || 0)}</span>
          &nbsp; CSPR &nbsp;
          <span style="color:#94a3b8">(${s.tx_count} tx)</span>
        </span>
      </div>`).join('');
  }

  function prependTableRow(record) {
    const tbody = document.getElementById('eventTable');
    const badge = record.action === 'inflow'
      ? '<span class="badge badge-in">INFLOW</span>'
      : '<span class="badge badge-out">OUTFLOW</span>';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${formatTime(record.timestamp)}</td>
      <td><a href="https://cspr.live/account/${record.actor_address}" target="_blank" rel="noopener" style="color:#c4b5fd;font-weight:600;text-decoration:underline dotted">${record.actor}</a></td>
      <td>${badge}</td>
      <td>${toCSPR(record.amount)}</td>
      <td class="mono"><a href="https://cspr.live/account/${record.target}" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:underline dotted">${record.target.slice(0, 20)}…</a></td>
      <td><span class="badge ${record.status==='success'?'badge-in':'badge-out'}">${record.status.charAt(0).toUpperCase()+record.status.slice(1)}</span></td>
      <td class="mono"><a href="https://cspr.live/transaction/${record.tx_hash}" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:underline dotted">${record.tx_hash.slice(0, 12)}…</a></td>`;
    tbody.prepend(row);
    while (tbody.rows.length > MAX_TABLE_ROWS) tbody.deleteRow(tbody.rows.length - 1);
  }

  function applyRecord(record) {
    if (!actorStats[record.actor]) {
      actorStats[record.actor] = { actions: {}, tx_count: 0 };
    }
    const s = actorStats[record.actor];
    s.tx_count += 1;
    s.actions[record.action] = (s.actions[record.action] || 0) + record.amount;
  }

  async function bootstrap() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) return;
      const data = await res.json();
      for (const [name, stats] of Object.entries(data.actors || {})) {
        actorStats[name] = { ...stats };
      }
      (data.recent_events || []).slice(0, MAX_TABLE_ROWS).reverse().forEach(prependTableRow);
      refreshChart();
      refreshStats();
    } catch (e) {
      console.warn('Bootstrap failed:', e);
    }
  }

  let sse = null;
  let reconnectDelay = 1000;

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource('/events');
    sse.onopen = () => {
      document.getElementById('sseStatusDot').style.background = '#22c55e';
      document.getElementById('sseStatusText').textContent = 'Connected — receiving live events';
      reconnectDelay = 1000;
    };
    sse.onmessage = (e) => {
      let record;
      try { record = JSON.parse(e.data); } catch (_) { return; }
      applyRecord(record);
      prependTableRow(record);
      refreshChart();
      refreshStats();
    };
    sse.onerror = () => {
      document.getElementById('sseStatusDot').style.background = '#ef4444';
      document.getElementById('sseStatusText').textContent =
        `Disconnected — reconnecting in ${reconnectDelay / 1000}s…`;
      sse.close();
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connectSSE();
      }, reconnectDelay);
    };
  }

  bootstrap().then(() => connectSSE());
  </script>
</body>
</html>
