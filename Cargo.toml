[workspace]
resolver = "2"
members = ["casper-common", "casper-ingestion", "casper-log-processor"]

[workspace.dependencies]
async-trait = "0.1.89"
anyhow = "1.0.100"
eventsource-stream = "0.2.2"
futures = "0.3.31"
futures-util = "0.3.31"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
serde = "1.0.228"
serde_json = "1.0.149"

sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "json",
] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
